name: Build and Test Wedding Platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client & Database
      run: |
        npx prisma generate
        npx prisma db push
        node prisma/seed.js

    - name: Run E2E Verification Tests
      run: node prisma/test-e2e.js

    - name: Build Next.js Application
      run: npm run build
